name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set artifact metadata
        id: metadata
        shell: bash
        env:
          PR_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commit_sha="${PR_COMMIT_SHA:-${GITHUB_SHA}}"
          echo "short_sha=${commit_sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks mingw-w64
          sudo luarocks --lua-version=5.1 install busted 2.3.0

      - name: Apply project patches
        run: bash scripts/setup.sh

      - name: Build Windows target
        run: ./launch.sh --build-only
        env:
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local-cache
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

      - name: Upload Windows build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: hollow-windows-pr-${{ steps.metadata.outputs.short_sha }}
          path: zig-out/bin/*.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set artifact metadata
        id: metadata
        shell: bash
        env:
          PR_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commit_sha="${PR_COMMIT_SHA:-${GITHUB_SHA}}"
          echo "short_sha=${commit_sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            pkg-config \
            lua5.1 \
            luajit \
            luarocks
          sudo luarocks --lua-version=5.1 install busted 2.3.0

      - name: Apply project patches
        run: bash scripts/setup.sh

      - name: Build Linux target
        run: zig build -Doptimize=ReleaseFast
        env:
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local-cache
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

      - name: Upload Linux build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: hollow-linux-pr-${{ steps.metadata.outputs.short_sha }}
          path: |
            zig-out/bin/hollow
            zig-out/bin/hollow-cli
            zig-out/bin/hollow-wsl-bypass
          if-no-files-found: error
          retention-days: 7

  comment-artifacts:
    name: Comment artifact links
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: write

    steps:
      - name: Create or update artifact comment
        uses: actions/github-script@v7
        env:
          WINDOWS_ARTIFACT_ID: ${{ needs.build-windows.outputs.artifact-id }}
          LINUX_ARTIFACT_ID: ${{ needs.build-linux.outputs.artifact-id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId,
            });
            const marker = '<!-- hollow-build-artifacts -->';
            const commitSha = context.payload.pull_request.head.sha;
            const commitUrl = `https://github.com/${owner}/${repo}/commit/${commitSha}`;
            const formatTimestamp = (timestamp) => new Date(timestamp).toISOString();
            const commitShortSha = commitSha.slice(0, 7);
            const artifacts = [
              {
                platform: 'Windows',
                name: `hollow-windows-pr-${commitShortSha}`,
                id: process.env.WINDOWS_ARTIFACT_ID,
              },
              {
                platform: 'Linux',
                name: `hollow-linux-pr-${commitShortSha}`,
                id: process.env.LINUX_ARTIFACT_ID,
              },
            ];
            const artifactRows = artifacts.map(
              (artifact) =>
                `| ${artifact.platform} | [${artifact.name}](https://github.com/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}) |`,
            );

            const body = [
              marker,
              '## PR builds',
              '',
              '| Platform | Download |',
              '| --- | --- |',
              ...artifactRows,
              '',
              `Built from [\`${commitShortSha}\`](${commitUrl}).`,
              `Started: ${formatTimestamp(run.created_at)}`,
              `Completed: ${formatTimestamp(run.updated_at)}`,
              `Build run: [#${run.run_number}](${run.html_url})`,
              '',
              '_Artifacts expire after 7 days._',
            ].join('\n');

            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existingComment = comments.find((comment) =>
              comment.body.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

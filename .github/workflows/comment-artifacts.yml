name: Comment Build Artifacts

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  comment:
    name: Comment artifact links
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Create or update artifact comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const marker = '<!-- hollow-build-artifacts -->';
            const commitUrl = `https://github.com/${owner}/${repo}/commit/${run.head_sha}`;
            const formatTimestamp = (timestamp) => new Date(timestamp).toISOString();
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: run.id, per_page: 100 },
            );

            const artifactLinks = artifacts
              .filter((artifact) => !artifact.expired)
              .sort((left, right) => left.name.localeCompare(right.name))
              .map((artifact) => ({
                name: artifact.name,
                platform: artifact.name.includes('windows') ? 'Windows' : 'Linux',
                url: `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`,
              }));
            const artifactRows = artifactLinks.map(
              (artifact) => `| ${artifact.platform} | [${artifact.name}](${artifact.url}) |`,
            );
            const commitShortSha = run.head_sha.slice(0, 7);

            const body = [
              marker,
              '## PR builds',
              '',
              '| Platform | Download |',
              '| --- | --- |',
              ...artifactRows,
              '',
              `Built from [\`${commitShortSha}\`](${commitUrl}).`,
              `Started: ${formatTimestamp(run.created_at)}`,
              `Completed: ${formatTimestamp(run.updated_at)}`,
              `Build run: [#${run.run_number}](${run.html_url})`,
              '',
              '_Artifacts expire after 7 days._',
            ].join('\n');

            let pullRequests = run.pull_requests;
            if (pullRequests.length === 0) {
              pullRequests = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: run.head_sha, per_page: 100 },
              );
            }

            for (const pullRequest of pullRequests) {
              const issue_number = pullRequest.number;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 },
              );
              const existingComment = comments.find((comment) =>
                comment.body.includes(marker),
              );

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            }

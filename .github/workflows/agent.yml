name: Agent conformance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-fs-exec:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Native Windows local fs/exec, WSL case requires explicit target
        shell: pwsh
        run: |
          zig test src/host_windows_test.zig -lc -OReleaseSafe 2>&1 | Tee-Object -FilePath fs-exec-windows-native.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fs-exec-windows-native
          path: fs-exec-windows-native.log
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install headless Lua test dependencies
        run: sudo apt-get update && sudo apt-get install -y luajit libluajit-5.1-dev lua-busted
      - name: Verify real Docker daemon is available
        run: docker info
      - name: Build static agent bundle
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe agent agent-all
      - name: Independent fs/exec release checks including real Docker and non-root production bootstrap
        run: python3 scripts/agent_fs_exec_release.py --profile local docker --output fs-exec-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fs-exec-release-docker
          path: fs-exec-release/
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build static agent artifacts without GUI dependencies
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe agent agent-all test-agent test-agent-loop test-agent-fs
      - name: Verify bundled checksums
        working-directory: zig-out/agents
        run: sha256sum -c SHA256SUMS
      - name: Test harness
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Local subprocess conformance
        run: python3 scripts/agent_conformance.py --connector local-subprocess --agent zig-out/bin/hollow-agent
      - name: Persistent native host transport
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-transport
      - name: Agent pane PTY client and server
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-agent-pty
      - name: Typed operations and HostManager lifecycle
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-operations test-host-manager test-host-local
      - name: Windows host transport compile check
        run: zig test src/host_transport.zig -target x86_64-windows-gnu -lc -fno-emit-bin
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman luajit libluajit-5.1-dev lua-busted
      - name: Native Lua host promises against real agent
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua test-host-lua-flat
      - name: Mock socket transport independence, native Lua and link-loss probes
        run: python3 scripts/agent_socket_tests.py --agent zig-out/bin/hollow-agent --fragment 257 --conformance -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua test-host-lua-flat
      - name: Windows host manager and Lua adapter compile checks
        run: |
          zig test src/host_manager_test.zig -target x86_64-windows-gnu -lc -fno-emit-bin
          zig test src/host_local_test.zig -target x86_64-windows-gnu -lc -fno-emit-bin
          zig test src/host_local_manager_test.zig -target x86_64-windows-gnu -lc -fno-emit-bin
          zig test src/host_lua_test.zig -target x86_64-windows-gnu -I /usr/include/luajit-2.1 -lc -fno-emit-bin
      - name: Same native Lua contract through rootless Podman
        run: python3 scripts/agent_host_tests.py --connector podman --agent zig-out/bin/hollow-agent -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua
      - name: Lua host promise contract
        run: LUA=luajit bash scripts/test-lua.sh src/lua/tests/test_host.lua src/lua/tests/test_host_connectors.lua src/lua/tests/test_host_pty.lua src/lua/tests/test_ui_workspace_host.lua
      - name: Production Lua Podman bootstrap, reuse and repair
        run: python3 scripts/agent_host_tests.py --connector podman-bootstrap --agent zig-out/bin/hollow-agent -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua
      - name: Production bootstrap preserves configured container UID/GID
        run: python3 scripts/agent_host_tests.py --connector podman-bootstrap --container-user 1000:1000 --agent zig-out/bin/hollow-agent -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua
      - name: Flat release bundle discovery through production Podman bootstrap
        run: python3 scripts/agent_host_tests.py --connector podman-bootstrap --agent zig-out/bin/hollow-agent -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua-flat
      - name: Rootless Podman conformance
        run: python3 scripts/agent_conformance.py --connector podman --image docker.io/library/alpine:3.21 --agent zig-out/bin/hollow-agent
      - name: Agent pane PTY through rootless Podman
        run: python3 scripts/agent_host_tests.py --connector podman --agent zig-out/bin/hollow-agent -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-agent-pty
      - uses: actions/upload-artifact@v4
        with:
          name: hollow-agent-linux-musl
          path: zig-out/agents/

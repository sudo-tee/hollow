name: Agent conformance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  agent-pane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fetch and patch terminal dependency without GUI or Lua dependencies
        run: bash scripts/setup.sh --agent-pane
      - name: Real pane bootstrap, terminal grid, queued input and exit isolation
        run: zig build -Dagent-pane-only=true test-agent-pane -Doptimize=ReleaseSafe
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install headless Lua test dependencies
        run: sudo apt-get update && sudo apt-get install -y luajit libluajit-5.1-dev lua-busted
      - name: Verify real Docker daemon is available
        run: docker info
      - name: Build static agent bundle
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe agent agent-all
      - name: Independent fs/exec release checks including real Docker and non-root production bootstrap
        run: python3 scripts/agent_fs_exec_release.py --profile local docker --output fs-exec-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fs-exec-release-docker
          path: fs-exec-release/
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build static agent artifacts without GUI dependencies
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe agent agent-all test-agent test-agent-loop test-agent-fs
      - name: Verify bundled checksums
        working-directory: zig-out/agents
        run: sha256sum -c SHA256SUMS
      - name: Test harness
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Local subprocess conformance
        run: python3 scripts/agent_conformance.py --connector local-subprocess --agent zig-out/bin/hollow-agent
      - name: Experimental opt-in agent PTY lifecycle
        run: python3 scripts/agent_pty_tests.py --agent zig-out/bin/hollow-agent
      - name: Focus negotiation, credit isolation and independent-agent SIGKILL survival
        run: python3 scripts/agent_focus_tests.py --agent zig-out/bin/hollow-agent
      - name: Persistent native host transport
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-transport
      - name: Experimental native streaming PTY and pane adapter
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-agent-pty
      - name: Build headless native-versus-agent PTY benchmark
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseFast agent agent-pty-bench
      - name: Benchmark correctness smoke, not performance qualification
        run: python3 scripts/agent_pty_bench.py --runs 1 --samples 20 --size-mib 1 --output agent-pty-smoke.jsonl
      - name: Shared 1/4/8/16 PTY routing, noisy and stalled-consumer smoke
        run: python3 scripts/agent_pty_bench.py --backend shared --sessions 1 4 8 16 --load idle noisy stalled --runs 1 --samples 20 --size-mib 1 --output agent-pty-shared-smoke.jsonl
      - name: Mixed filesystem and exec contention with stopped PTY consumption and resizes
        run: python3 scripts/agent_pty_bench.py --backend all --sessions 4 --load stalled --bulk mixed --resize-every 8 --runs 1 --samples 20 --size-mib 1 --output agent-pty-bulk-smoke.jsonl
      - name: Opt-in bounded agent queue diagnostics, not latency qualification
        run: HOLLOW_AGENT_QUEUE_PROFILE=1 python3 scripts/agent_pty_bench.py --telemetry --backend shared --sessions 4 --load stalled --bulk off mixed --resize-every 8 --runs 1 --samples 40 --size-mib 1 --output agent-pty-queue-smoke.jsonl
      - name: Opt-in bounded bulk ordering, metadata and cancellation regressions
        run: HOLLOW_AGENT_BOUNDED_BULK=1 zig build --build-file build-agent.zig test-agent-loop test-agent-pty -Doptimize=ReleaseSafe
      - name: Opt-in bounded bulk checked shared contention smoke
        run: HOLLOW_AGENT_BOUNDED_BULK=1 HOLLOW_AGENT_QUEUE_PROFILE=1 python3 scripts/agent_pty_bench.py --telemetry --backend shared --sessions 4 --load stalled --bulk off mixed --resize-every 8 --runs 1 --samples 40 --size-mib 1 --output agent-pty-bounded-smoke.jsonl
      - name: Explicit hierarchical focus checked contention smoke, not qualification
        run: HOLLOW_AGENT_BOUNDED_BULK=1 HOLLOW_AGENT_FOCUS_SCHEDULER=1 python3 scripts/agent_pty_bench.py --focus-scheduler --backend shared --sessions 8 --load stalled --bulk off mixed --bulk-exec-bytes 65536 --resize-every 8 --runs 1 --samples 200 --size-mib 10 --output agent-pty-focus-smoke.jsonl
      - name: Bounded per-sequence focus dispatch, readiness and payload-write correlation
        run: HOLLOW_AGENT_BOUNDED_BULK=1 HOLLOW_AGENT_FOCUS_SCHEDULER=1 HOLLOW_AGENT_QUEUE_PROFILE=1 python3 scripts/agent_pty_bench.py --telemetry --focus-scheduler --focus-every 32 --backend shared --sessions 8 --load stalled --bulk off mixed --bulk-exec-bytes 65536 --resize-every 8 --runs 1 --samples 100 --size-mib 10 --output agent-pty-focus-profile-smoke.jsonl
      - name: Explicit separate bulk agent with full sixteen-PTY admission, not qualification
        run: HOLLOW_AGENT_BOUNDED_BULK=1 HOLLOW_AGENT_FOCUS_SCHEDULER=1 python3 scripts/agent_pty_bench.py --focus-scheduler --separate-bulk --backend shared --sessions 16 --load stalled --bulk mixed --bulk-exec-bytes 65536 --resize-every 8 --runs 1 --samples 200 --size-mib 10 --output agent-pty-split-bulk-smoke.jsonl
      - name: Hierarchical byte-deficit wire correctness and independent-agent SIGKILL survival
        run: python3 scripts/agent_focus_tests.py --agent zig-out/bin/hollow-agent --deficit-scheduler
      - name: Hierarchical byte-deficit checked contention, not qualification
        run: HOLLOW_AGENT_BOUNDED_BULK=1 HOLLOW_AGENT_FOCUS_SCHEDULER=1 HOLLOW_AGENT_DEFICIT_SCHEDULER=1 python3 scripts/agent_pty_bench.py --focus-scheduler --deficit-scheduler --backend shared --sessions 8 --load stalled --bulk off mixed --bulk-exec-bytes 65536 --resize-every 8 --runs 1 --samples 200 --size-mib 10 --output agent-pty-deficit-smoke.jsonl
      - name: Explicit isolated foreground with separately labeled host telemetry
        run: HOLLOW_AGENT_BOUNDED_BULK=1 HOLLOW_AGENT_FOCUS_SCHEDULER=1 HOLLOW_AGENT_DEFICIT_SCHEDULER=1 python3 scripts/agent_pty_bench.py --telemetry --focus-scheduler --deficit-scheduler --focus-every 32 --separate-foreground --backend shared --sessions 8 --load stalled --bulk mixed --bulk-exec-bytes 65536 --resize-every 8 --runs 1 --samples 200 --size-mib 10 --output agent-pty-isolated-foreground-smoke.jsonl
      - name: Windows experimental PTY adapter compile check
        run: zig test -target x86_64-windows-gnu --dep build_options -Mroot=src/agent_pty_test.zig -Mbuild_options=src/agent_pty_build_options.zig -lc -fno-emit-bin
      - name: Typed operations and HostManager lifecycle
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-operations test-host-manager test-host-local
      - name: Windows host transport compile check
        run: zig test src/host_transport.zig -target x86_64-windows-gnu -lc -fno-emit-bin
      - name: Local crash and EOF containment
        run: python3 scripts/agent_fault_probe.py --agent zig-out/bin/hollow-agent --output agent-faults-local.json
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman luajit libluajit-5.1-dev lua-busted
      - name: Native Lua host promises against real agent
        run: zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua test-host-lua-flat
      - name: Mock socket transport independence, native Lua and link-loss probes
        run: python3 scripts/agent_socket_tests.py --agent zig-out/bin/hollow-agent --fragment 257 --conformance -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua test-host-lua-flat
      - name: Windows host manager and Lua adapter compile checks
        run: |
          zig test src/host_manager_test.zig -target x86_64-windows-gnu -lc -fno-emit-bin
          zig test src/host_local_test.zig -target x86_64-windows-gnu -lc -fno-emit-bin
          zig test src/host_local_manager_test.zig -target x86_64-windows-gnu -lc -fno-emit-bin
          zig test src/host_lua_test.zig -target x86_64-windows-gnu -I /usr/include/luajit-2.1 -lc -fno-emit-bin
      - name: Same native Lua contract through rootless Podman
        run: python3 scripts/agent_host_tests.py --connector podman --agent zig-out/bin/hollow-agent -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua
      - name: Lua host promise contract
        run: LUA=luajit bash scripts/test-lua.sh src/lua/tests/test_host.lua src/lua/tests/test_host_artifacts.lua src/lua/tests/test_host_podman.lua src/lua/tests/test_host_docker.lua src/lua/tests/test_host_wsl.lua src/lua/tests/test_host_ssh.lua src/lua/tests/test_ui_workspace_host.lua
      - name: Production Lua Podman bootstrap, reuse and repair
        run: python3 scripts/agent_host_tests.py --connector podman-bootstrap --agent zig-out/bin/hollow-agent -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua
      - name: Production bootstrap preserves configured container UID/GID
        run: python3 scripts/agent_host_tests.py --connector podman-bootstrap --container-user 1000:1000 --agent zig-out/bin/hollow-agent -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua
      - name: Flat release bundle discovery through production Podman bootstrap
        run: python3 scripts/agent_host_tests.py --connector podman-bootstrap --agent zig-out/bin/hollow-agent -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-host-lua-flat
      - name: Rootless Podman conformance
        run: python3 scripts/agent_conformance.py --connector podman --image docker.io/library/alpine:3.21 --agent zig-out/bin/hollow-agent
      - name: Same experimental PTY implementation through rootless Podman
        run: python3 scripts/agent_host_tests.py --connector podman --agent zig-out/bin/hollow-agent -- python3 scripts/agent_pty_tests.py --agent zig-out/bin/hollow-agent
      - name: Native streaming PTY adapter through rootless Podman
        run: python3 scripts/agent_host_tests.py --connector podman --agent zig-out/bin/hollow-agent -- zig build --build-file build-agent.zig -Doptimize=ReleaseSafe test-agent-pty
      - name: Rootless Podman crash and EOF containment
        run: python3 scripts/agent_fault_probe.py --connector podman --agent zig-out/bin/hollow-agent --image docker.io/library/alpine:3.21 --output agent-faults-podman.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hollow-agent-fault-diagnostics
          path: |
            agent-faults-*.json
            agent-pty-smoke.jsonl
            agent-pty-shared-smoke.jsonl
            agent-pty-bulk-smoke.jsonl
            agent-pty-queue-smoke.jsonl
            agent-pty-bounded-smoke.jsonl
            agent-pty-focus-smoke.jsonl
            agent-pty-focus-profile-smoke.jsonl
            agent-pty-split-bulk-smoke.jsonl
            agent-pty-deficit-smoke.jsonl
            agent-pty-isolated-foreground-smoke.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: hollow-agent-linux-musl
          path: zig-out/agents/
